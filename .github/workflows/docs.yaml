name: Docs

on:
  # Build and Test already builds develop from main, so reuse that trusted artifact.
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing the documentation sources
        required: false
        type: string
      package_version:
        description: Final X.Y.Z qdk-chemistry version to install (defaults to VERSION)
        required: false
        type: string
      stable:
        description: Update stable if this version is newer
        required: false
        default: false
        type: boolean
      publish:
        description: Push the result to the gh-pages branch
        required: false
        default: false
        type: boolean

# Serialize gh-pages writes without canceling an active publication.
concurrency:
  group: docs-publish
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  config:
    name: Resolve configuration
    # workflow_run has a write-capable downstream token. Only consume artifacts
    # produced by a successful push to this repository's default branch.
    if: >-
      (github.event_name != 'release' || github.event.release.prerelease == false) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
      package_version: ${{ steps.resolve.outputs.package_version }}
      publish: ${{ steps.resolve.outputs.publish }}
      ref: ${{ steps.resolve.outputs.ref }}
      sha: ${{ steps.resolve.outputs.sha }}
      source: ${{ steps.resolve.outputs.source }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      stable: ${{ steps.resolve.outputs.stable }}
      target: ${{ steps.resolve.outputs.target }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}

    - name: Resolve inputs
      id: resolve
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EVENT: ${{ github.event_name }}
        INPUT_PACKAGE_VERSION: ${{ inputs.package_version }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_STABLE: ${{ inputs.stable }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        if [[ "$EVENT" == "workflow_run" ]]; then
          PACKAGE_VERSION=""
          PUBLISH=true
          REF="$DEFAULT_BRANCH"
          SHA="$RUN_SHA"
          SOURCE=artifact
          SOURCE_RUN_ID="$RUN_ID"
          STABLE=false
          TARGET=develop
          VERSION=develop
        else
          if [[ "$EVENT" == "release" ]]; then
            PACKAGE_VERSION="${RELEASE_TAG#v}"
            PUBLISH=true
            REF="$RELEASE_TAG"
            STABLE=true
          else
            PACKAGE_VERSION="${INPUT_PACKAGE_VERSION:-$(cat VERSION)}"
            PUBLISH="${INPUT_PUBLISH:-false}"
            REF="${INPUT_REF:-$GITHUB_REF_NAME}"
            STABLE="${INPUT_STABLE:-false}"
          fi

          if [[ ! "$PACKAGE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Invalid final release version '$PACKAGE_VERSION'; expected X.Y.Z."
            exit 1
          fi
          TARGET="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          VERSION="$TARGET"
          SHA="$(git rev-parse HEAD)"
          SOURCE=build
          SOURCE_RUN_ID=""
        fi

        OWNER="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
        NAME="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
        {
          echo "base_url=https://${OWNER}.github.io/${NAME}/"
          echo "package_version=$PACKAGE_VERSION"
          echo "publish=$PUBLISH"
          echo "ref=$REF"
          echo "sha=$SHA"
          echo "source=$SOURCE"
          echo "source_run_id=$SOURCE_RUN_ID"
          echo "stable=$STABLE"
          echo "target=$TARGET"
          echo "version=$VERSION"
        } >> "$GITHUB_OUTPUT"

  build:
    name: Build release documentation
    needs: config
    if: needs.config.outputs.source == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout documentation sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.config.outputs.sha }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        cache: pip
        python-version: '3.13'

    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Install released qdk-chemistry
      env:
        PACKAGE_VERSION: ${{ needs.config.outputs.package_version }}
      run: |
        python -m pip install --upgrade pip
        if ! python -m pip install "qdk-chemistry[all]==${PACKAGE_VERSION}"; then
          echo "::error::Could not install qdk-chemistry ${PACKAGE_VERSION} from PyPI. The wheel pipeline is separately approved; rerun Docs after the wheel is published."
          exit 1
        fi

    - name: Build documentation
      working-directory: docs
      env:
        QDK_CHEMISTRY_DOCS_BASE_URL: ${{ needs.config.outputs.base_url }}${{ needs.config.outputs.target }}/
        QDK_CHEMISTRY_DOCS_VERSION: ${{ needs.config.outputs.version }}
      run: make clean all

    - name: Upload documentation artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: docs-html
        path: docs/build/html
        retention-days: 7

  publish:
    name: Publish documentation
    needs: [config, build]
    if: >-
      !cancelled() &&
      needs.config.outputs.publish == 'true' &&
      needs.build.result != 'failure'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest

    steps:
    # Always use the current assembler, including when old release sources were built.
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Check for a gh-pages branch
      id: gh_pages
      run: |
        if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout gh-pages branch
      if: steps.gh_pages.outputs.exists == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        path: gh-pages
        ref: gh-pages

    - name: Checkout for a new gh-pages branch
      if: steps.gh_pages.outputs.exists != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: gh-pages

    - name: Create gh-pages branch
      if: steps.gh_pages.outputs.exists != 'true'
      working-directory: gh-pages
      run: |
        git checkout --orphan gh-pages
        git rm -rf --quiet .

    - name: Download release documentation
      if: needs.config.outputs.source == 'build'
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      with:
        name: docs-html
        path: docs-html

    - name: Download develop documentation
      if: needs.config.outputs.source == 'artifact'
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      with:
        github-token: ${{ github.token }}
        name: docs-html
        path: docs-html
        run-id: ${{ needs.config.outputs.source_run_id }}

    - name: Update site
      env:
        BASE_URL: ${{ needs.config.outputs.base_url }}
        PACKAGE_VERSION: ${{ needs.config.outputs.package_version }}
        REF: ${{ needs.config.outputs.ref }}
        SHA: ${{ needs.config.outputs.sha }}
        SITE: gh-pages/docs
        STABLE: ${{ needs.config.outputs.stable }}
        TARGET: ${{ needs.config.outputs.target }}
        VERSION: ${{ needs.config.outputs.version }}
      run: |
        mkdir -p "$SITE"
        STABLE_ARG=()
        if [[ "$STABLE" == "true" ]]; then
          STABLE_ARG=(--stable)
        fi
        python3 .github/scripts/docs_site.py --site "$SITE" --base-url "$BASE_URL" \
          install --html docs-html --target "$TARGET" --version "$VERSION" \
          --package-version "$PACKAGE_VERSION" --commit "$SHA" --ref "$REF" \
          "${STABLE_ARG[@]}"

    - name: Commit and push
      working-directory: gh-pages
      env:
        PACKAGE_VERSION: ${{ needs.config.outputs.package_version }}
        SHA: ${{ needs.config.outputs.sha }}
        TARGET: ${{ needs.config.outputs.target }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add --all --force docs

        if git diff --cached --quiet; then
          echo "Documentation is already up to date."
          exit 0
        fi

        LABEL="${PACKAGE_VERSION:-develop}"
        git commit -m "Update ${TARGET} docs to ${LABEL} (${SHA:0:8})"
        git push origin gh-pages
